<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Light Cafe - Digital Menu</title>
    <!-- Firebase core SDKs (Realtime Database को लागि) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background-color: #0A0800; /* Deep Black */
            color: #F5EBE6; /* Cream Text */
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
            border: 1.5.dp solid #D4AF37; /* Gold Primary border */
            border-radius: 16px;
            background-color: #111111; /* Card Dark */
        }
        h2 {
            color: #D4AF37; /* Gold */
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #222;
            background-color: #1A1A1A;
            color: #fff;
            box-sizing: border-box;
        }
        .order-btn {
            background-color: #D4AF37;
            color: #000;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .order-btn:hover {
            background-color: #FFFDD0; /* Gold Light */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌙 Moon Light Cafe Menu</h2>
    <p style="text-align:center; font-size:12px; color:#888;">Order Digital System</p>
    
    <hr style="border-color: #222;">

    <!-- १. टेबल नम्बर छनोट -->
    <div class="form-group">
        <label for="tableNumber">📍 टेबल नम्बर छान्नुहोस् (Select Table):</label>
        <select id="tableNumber">
            <option value="1">Table 1</option>
            <option value="2">Table 2</option>
            <option value="10">Table 10</option>
            <option value="19" selected>Table 19</option> <!-- तपाईंको टेबल १९ परीक्षणको लागि -->
        </select>
    </div>

    <!-- २. आइटम छनोट (उदाहरण) -->
    <div class="form-group">
        <label for="itemName">🥟 परिकार (Select Item):</label>
        <select id="itemName" onchange="updatePrice()">
            <option value="Chicken Momo" data-price="120">Chicken Momo - Rs. 120</option>
            <option value="Moon Light Special Pizza" data-price="500">Moon Light Special Pizza - Rs. 500</option>
            <option value="Moon Light Special Coffee" data-price="250">Moon Light Special Coffee - Rs. 250</option>
        </select>
    </div>

    <!-- ३. परिमाण (Quantity) -->
    <div class="form-group">
        <label for="quantity">🔢 संख्या (Quantity):</label>
        <input type="number" id="quantity" value="1" min="1" oninput="updatePrice()">
    </div>

    <!-- ४. विशेष अनुरोध (Cooking Note) -->
    <div class="form-group">
        <label for="orderNote">💬 भान्सेलाई नोट (Cooking Note):</label>
        <textarea id="orderNote" placeholder="उदा: No onions, spicy..."></textarea>
    </div>

    <!-- ५. कुल मूल्य प्रदर्शन -->
    <div class="form-group">
        <h3 style="color: #FFFDD0;">कुल जम्मा (Total Price): Rs. <span id="totalDisplay">120</span></h3>
    </div>

    <!-- अर्डर बटन -->
    <button class="order-btn" onclick="placeCustomerOrder()">SEND ORDER TO KITCHEN 🔥</button>
</div>

<script>
    // ⚠️ यहाँ तपाईंको आफ्नो Firebase परियोजनाको सिधा Config विवरण राख्नुहोस्
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com", // यदि Realtime database हो भने आवश्यक पर्छ
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // Firebase सुरु गर्ने
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // मूल्य स्वतः अपडेट गर्ने फंक्सन
    function updatePrice() {
        const itemSelect = document.getElementById("itemName");
        const price = parseInt(itemSelect.options[itemSelect.selectedIndex].getAttribute("data-price"));
        const qty = parseInt(document.getElementById("quantity").value) || 1;
        document.getElementById("totalDisplay").innerText = price * qty;
    }

    // मुख्य अर्डर पठाउने फंक्सन (एपको कडा ढाँचासँग मिलेको)
    function placeCustomerOrder() {
        const tableNum = document.getElementById("tableNumber").value.toString(); // एपले String मा "19" खोज्छ
        const itemSelect = document.getElementById("itemName");
        const selectedItemName = itemSelect.value;
        const itemPrice = parseInt(itemSelect.options[itemSelect.selectedIndex].getAttribute("data-price"));
        const qty = parseInt(document.getElementById("quantity").value) || 1;
        const note = document.getElementById("orderNote").value.trim();

        const totalPrice = itemPrice * qty; // एपको 'totalPrice: Int' को लागि[cite: 4, 6]

        // 🎯 एपको 'OrderItem' डेटा ढाँचा (नेमस्पेस र स्पेलिङ मिलाइएको)
        const orderItemsList = [
            {
                name: selectedItemName, // 'name' (साना अक्षरमा)[cite: 6]
                qty: qty,               // 'qty' (Int नम्बर)[cite: 6]
                price: itemPrice        // 'price' (Int नम्बर)[cite: 6]
            }
        ];

        // 🎯 एपको 'FirebaseOrder' क्लाससँग दुरुस्तै मिल्ने अब्जेक्ट[cite: 4, 6]
        const newOrder = {
            tableNumber: tableNum,                 // 'tableNumber' (N ठूलो अक्षर)[cite: 4, 6]
            status: "new",                         // 'status'[cite: 4, 6]
            timestamp: Date.now(),                 // Long प्रकारको समय[cite: 4, 6]
            totalPrice: totalPrice,               // 'totalPrice' (P ठूलो अक्षर र Int नम्बर)[cite: 4, 6]
            note: note.length > 0 ? note : null,   // 'note'[cite: 4, 6]
            items: orderItemsList                  // 'items' लिस्ट[cite: 4, 6]
        };

        // एपको 'orders.json'[cite: 6] पाथमा डेटा POST / PUSH गर्ने
        database.ref('orders').push(newOrder)
            .then(() => {
                alert("🎉 अर्डर सफल भयो! काउन्टर एपको काउन्टरमा टेबल नम्बर " + tableNum + " को रूपमा सूचिकृत भइसक्यो।");
                document.getElementById("orderNote").value = "";
            })
            .catch((error) => {
                alert("⚠️ अर्डर पठाउन सकिएन: " + error.message);
            });
    }
</script>

</body>
</html>
