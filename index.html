<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेनु - स्वागत छ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-md mx-auto p-4">
  <h1 class="text-3xl font-bold text-center text-green-700 mb-2">🍽️ हाम्रो मेनु</h1>
  <p class="text-center text-gray-600">टेबल नं: <span id="tableNo" class="font-bold text-2xl"></span></p>

  <div id="menu" class="space-y-4 mt-8"></div>

  <div class="fixed bottom-6 left-4 right-4">
    <button onclick="placeOrder()" class="w-full bg-green-700 hover:bg-green-800 text-white py-4 rounded-2xl text-xl font-bold shadow-lg">
      Order Place गर्नुहोस् (<span id="orderCount">0</span>)
    </button>
  </div>
</div>

<script>
// ==================== यहाँ तपाईंको Firebase Config राख्नुहोस् ====================
const firebaseConfig = {
  apiKey: "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
  authDomain: "your-project-id.firebaseapp.com",
  projectId: "your-project-id",
  storageBucket: "your-project-id.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:xxxxxxxxxxxxxxxxxxxxxxxx"
};
// =============================================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentTable = "1";
let cart = [];

// URL बाट टेबल नम्बर लिनुहोस्
const params = new URLSearchParams(window.location.search);
currentTable = params.get('table') || '1';
document.getElementById('tableNo').innerText = currentTable;

// Sample Menu (तपाईंले थप्न सक्नुहुन्छ)
const menuItems = [
  {id:1, name:"चिकेन मो:मो", price:180, desc:"६ पिस"},
  {id:2, name:"भेज मो:मो", price:160, desc:"६ पिस"},
  {id:3, name:"चिकेन चिल्ली", price:220, desc:"प्लेट"},
  {id:4, name:"कोक / फेन्टा", price:60, desc:"५००ml"},
  {id:5, name:"फ्राइड राइस", price:180, desc:"चिकेन"},
];

function renderMenu() {
  const container = document.getElementById('menu');
  container.innerHTML = menuItems.map(item => `
    <div class="bg-white p-4 rounded-2xl shadow flex justify-between items-center">
      <div>
        <h3 class="font-semibold">${item.name}</h3>
        <p class="text-sm text-gray-500">${item.desc}</p>
      </div>
      <div class="text-right">
        <p class="font-bold text-lg">₹${item.price}</p>
        <button onclick="addItem(${item.id})" class="mt-2 bg-green-600 text-white px-5 py-1 rounded-xl text-sm">थप्नुहोस्</button>
      </div>
    </div>
  `).join('');
}

function addItem(id) {
  const item = menuItems.find(i => i.id === id);
  cart.push({...item, qty: 1});
  document.getElementById('orderCount').innerText = cart.length;
}

async function placeOrder() {
  if(cart.length === 0) return alert("कृपया केही आइटम थप्नुहोस्");

  const orderData = {
    table: currentTable,
    items: cart,
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    status: "new",
    total: cart.reduce((sum, i) => sum + i.price, 0)
  };

  await db.collection("orders").add(orderData);
  
  alert("✅ Order सफलतापूर्वक पठाइयो!\nकाउन्टरले चाँडै तयार पार्छ।");
  cart = [];
  document.getElementById('orderCount').innerText = 0;
}
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAohDLMyfCo0Mivw99agloetfxPYrRcHPo",
  authDomain: "my-restaurant-qr.firebaseapp.com",
  databaseURL: "https://my-restaurant-qr-default-rtdb.firebaseio.com",
  projectId: "my-restaurant-qr",
  storageBucket: "my-restaurant-qr.firebasestorage.app",
  messagingSenderId: "67721943429",
  appId: "1:67721943429:web:392ec74551af0ef67a0cec",
  measurementId: "G-JVX1VGNQPB"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
renderMenu();
</script>
</body>
</html>
