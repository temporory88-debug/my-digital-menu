<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डिजिटल मेनु - रेस्टुरेन्ट</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-24">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
    <div class="bg-green-700 text-white p-6 rounded-b-3xl text-center sticky top-0 z-50">
      <h1 class="text-2xl font-bold">🍽️ हाम्रो डिजिटल मेनु</h1>
      <p class="mt-2 bg-green-800 inline-block px-4 py-1 rounded-full text-sm font-semibold">
        टेबल नम्बर: <span id="tableNo" class="text-yellow-300 text-base">१०</span>
      </p>
    </div>

    <div class="p-4 space-y-4" id="menu-container">
      <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border">
        <div>
          <h3 class="font-bold text-gray-800 text-lg">चिकेन मःम</h3>
          <p class="text-xs text-gray-500">१ प्लेट (१० पिस)</p>
          <p class="font-extrabold text-green-700 mt-1">रु. १८०</p>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="changeQty(1, -1)" class="bg-gray-200 text-gray-800 w-8 h-8 rounded-full font-bold">-</button>
          <span id="qty-1" class="font-bold text-lg w-6 text-center">0</span>
          <button onclick="changeQty(1, 1)" class="bg-green-600 text-white w-8 h-8 rounded-full font-bold">+</button>
        </div>
      </div>

      <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border">
        <div>
          <h3 class="font-bold text-gray-800 text-lg">भेज चाउमिन</h3>
          <p class="text-xs text-gray-500">१ प्लेट</p>
          <p class="font-extrabold text-green-700 mt-1">रु. १२०</p>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="changeQty(2, -1)" class="bg-gray-200 text-gray-800 w-8 h-8 rounded-full font-bold">-</button>
          <span id="qty-2" class="font-bold text-lg w-6 text-center">0</span>
          <button onclick="changeQty(2, 1)" class="bg-green-600 text-white w-8 h-8 rounded-full font-bold">+</button>
        </div>
      </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white p-4 shadow-lg rounded-t-3xl border-t">
      <div class="flex justify-between items-center mb-3 px-2">
        <span class="text-gray-600 font-medium">कुल रकम:</span>
        <span id="total-price" class="text-xl font-black text-green-700">रु. ०</span>
      </div>
      <button onclick="placeOrder()" id="orderBtn" class="w-full bg-green-700 text-white py-4 rounded-2xl text-lg font-bold">
        🚀 अर्डर पठाउनुहोस् (<span id="total-items">०</span> आइटम)
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // तपाईंको फायरबेस कन्फिगरेसन
    const firebaseConfig = {
      apiKey: "AIzaSyAohDLMyfCo0Mivw99agloetfxPYrRcHPo",
      authDomain: "my-restaurant-qr.firebaseapp.com",
      projectId: "my-restaurant-qr",
      storageBucket: "my-restaurant-qr.firebasestorage.app",
      messagingSenderId: "67721943429",
      appId: "1:67721943429:web:392ec74551af0ef67a0cec"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global Functions to make them accessible outside module
    window.products = {
      1: { name: "चिकेन मःम", price: 180, qty: 0 },
      2: { name: "भेज चाउमिन", price: 120, qty: 0 }
    };

    const params = new URLSearchParams(window.location.search);
    window.tableNumber = params.get('table') || '१०';
    document.getElementById('tableNo').innerText = window.tableNumber;

    window.changeQty = function(id, amount) {
      if (window.products[id].qty + amount >= 0) {
        window.products[id].qty += amount;
        document.getElementById(`qty-${id}`).innerText = window.products[id].qty;
        updateSummary();
      }
    }

    function updateSummary() {
      let totalItems = 0;
      let totalPrice = 0;
      for (let id in window.products) {
        totalItems += window.products[id].qty;
        totalPrice += window.products[id].qty * window.products[id].price;
      }
      document.getElementById('total-items').innerText = totalItems;
      document.getElementById('total-price').innerText = "रु. " + totalPrice;
    }

    window.placeOrder = async function() {
      let finalOrder = [];
      for (let id in window.products) {
        if (window.products[id].qty > 0) {
          finalOrder.push({
            name: window.products[id].name,
            qty: window.products[id].qty,
            price: window.products[id].price
          });
        }
      }

      if (finalOrder.length === 0) {
        alert("❌ कृपया पहिले मेनुबाट केही आइटम थप्नुहोस्!");
        return;
      }

      const btn = document.getElementById('orderBtn');
      btn.disabled = true;
      btn.innerText = "पठाउँदै...";

      try {
        // Firebase Firestore मा डेटा सेभ गर्ने
        await addDoc(collection(db, "orders"), {
          table: window.tableNumber,
          items: finalOrder,
          status: "Pending",
          createdAt: serverTimestamp()
        });

        alert("✅ अर्डर सफलतापूर्वक काउन्टरमा पठाइयो!");
        
        // Reset quantities
        for (let id in window.products) { window.products[id].qty = 0; document.getElementById(`qty-${id}`).innerText = 0; }
        updateSummary();

      } catch (error) {
        console.error("Error sending order: ", error);
        alert("❌ अर्डर पठाउन सकिएन। फायरबेसको Rules चेक गर्नुहोस्।");
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 अर्डर पठाउनुहोस् (० आइटम)";
      }
    }
  </script>
</body>
</html>
