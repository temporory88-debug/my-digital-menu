<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हाम्रो डिजिटल मेनु</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-24">

  <div class="bg-green-700 text-white p-5 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">🍔 डिजिटल क्याफे</h1>
        <p class="text-xs opacity-80">ताजा र मिठो परिकार</p>
      </div>
      <div class="bg-white text-green-700 px-4 py-2 rounded-full font-bold shadow">
        टेबल नं: <span id="tableNo">--</span>
      </div>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-6">
    
    <div>
      <h2 class="text-lg font-bold text-gray-800 mb-3 border-b-2 border-green-500 pb-1">🥟 मोमो क्याटेगोरी</h2>
      <div class="space-y-3">
        <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
          <div>
            <h3 class="font-semibold text-gray-800">चिकन मो:मो</h3>
            <p class="text-sm text-gray-500">१० पिस (लोकल स्वाद)</p>
            <p class="font-bold text-green-700 mt-1">रु. १८०</p>
          </div>
          <button onclick="addToCart(1, 'चिकन मो:मो', 180)" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold transition">थप्नुहोस्</button>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
          <div>
            <h3 class="font-semibold text-gray-800">भेज मो:मो</h3>
            <p class="text-sm text-gray-500">१० पिस (ताजा तरकारी)</p>
            <p class="font-bold text-green-700 mt-1">रु. १३०</p>
          </div>
          <button onclick="addToCart(2, 'भेज मो:मो', 130)" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold transition">थप्नुहोस्</button>
        </div>
      </div>
    </div>

    <div>
      <h2 class="text-lg font-bold text-gray-800 mb-3 border-b-2 border-green-500 pb-1">🍜 चाउमिन र नुडल्स</h2>
      <div class="space-y-3">
        <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
          <div>
            <h3 class="font-semibold text-gray-800">चिकन चाउमिन</h3>
            <p class="text-sm text-gray-500">फुल प्लेट</p>
            <p class="font-bold text-green-700 mt-1">रु. १५०</p>
          </div>
          <button onclick="addToCart(3, 'चिकन चाउमिन', 150)" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold transition">थप्नुहोस्</button>
        </div>
      </div>
    </div>

  </div>

  <div class="fixed bottom-0 left-0 right-0 bg-white shadow-lg border-t p-4 z-50">
    <div class="max-w-md mx-auto">
      <button onclick="viewCart()" id="orderBtn" class="w-full bg-gray-400 text-white py-3 rounded-xl text-lg font-bold transition" disabled>
        Order गर्नुहोस् (० आइटम)
      </button>
    </div>
  </div>

  <script>
    let cart = {};
    
    // URL बाट टेबल नम्बर लिने (जस्तै: index.html?table=5)
    const params = new URLSearchParams(window.location.search);
    const tableNum = params.get('table') || '१';
    document.getElementById('tableNo').innerText = tableNum;

    function addToCart(id, name, price) {
      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        cart[id] = { name: name, price: price, qty: 1 };
      }
      updateOrderButton();
    }

    function updateOrderButton() {
      let totalItems = 0;
      let totalPrice = 0;
      
      for (let id in cart) {
        totalItems += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }

      const btn = document.getElementById('orderBtn');
      if (totalItems > 0) {
        btn.innerText = `Order गर्नुहोस् (${totalItems} आइटम - रु.${totalPrice})`;
        btn.className = "w-full bg-green-700 hover:bg-green-800 text-white py-3 rounded-xl text-lg font-bold transition cursor-pointer";
        btn.disabled = false;
      } else {
        btn.innerText = "Order गर्नुहोस् (० आइटम)";
        btn.className = "w-full bg-gray-400 text-white py-3 rounded-xl text-lg font-bold transition";
        btn.disabled = true;
      }
    }

    function viewCart() {
      let orderSummary = `टेबल नम्बर ${tableNum} को अर्डर:\n\n`;
      for (let id in cart) {
        orderSummary += `- ${cart[id].name} x ${cart[id].qty} = रु. ${cart[id].qty * cart[id].price}\n`;
      }
      
      alert(orderSummary + "\n✅ अर्डर सफलतापूर्वक पठाइयो! काउन्टरले चाँडै तयार पार्नेछ।");
      
      // अर्डर पठाएपछि कार्ट खाली गर्ने
      cart = {};
      updateOrderButton();
    }
  </script>
</body>
</html>
